<script>
// V28 local deployment: no visual styles, menus or HTML from the provided reference have been modified.
(function(){
  const bootstrap=__BOOTSTRAP__;
  const storageKey='mkios_v19_data';
  if(bootstrap && bootstrap.data && Object.keys(bootstrap.data).length){
    try{localStorage.setItem(storageKey, JSON.stringify(bootstrap.data))}catch(e){console.error('localStorage init failed',e)}
  }
  let pending=null;let busy=false;let lastPayload=null;
  window.MKIOS_DB_PERSIST=function(data){
    // browser cache is retained for V28 backwards compatibility; durable copy goes to SQLite
    lastPayload=data;
    if(pending) clearTimeout(pending);
    pending=setTimeout(async function flush(){
      if(busy){pending=setTimeout(flush,250);return}
      busy=true;const payload=lastPayload;lastPayload=null;
      try{
        const res=await fetch('/api/state/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':bootstrap.csrf},credentials:'same-origin',body:JSON.stringify({data:payload})});
        if(!res.ok) throw Error('HTTP '+res.status);
        window.dispatchEvent(new CustomEvent('mkios-db-saved'));
      }catch(e){console.error('Gagal simpan ke SQLite:',e);window.dispatchEvent(new CustomEvent('mkios-db-error',{detail:String(e)}));}
      finally{busy=false;if(lastPayload!==null){pending=setTimeout(flush,60)}}
    },100);
  };
})();
</script>

<script>
window.MKQRCodeCore = (()=>{
  const modules = Object.create(null);
  const cache = Object.create(null);
  function normalize(name){return String(name||'').replace(/^\.\/?/,'').replace(/\.js$/,'');}
modules["QR8bitByte"]=function(module,exports,require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
modules["QRBitBuffer"]=function(module,exports,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};
modules["QRErrorCorrectLevel"]=function(module,exports,require){
module.exports = {
	L : 1,
	M : 0,
	Q : 3,
	H : 2
};


};
modules["QRMaskPattern"]=function(module,exports,require){
module.exports = {
	PATTERN000 : 0,
	PATTERN001 : 1,
	PATTERN010 : 2,
	PATTERN011 : 3,
	PATTERN100 : 4,
	PATTERN101 : 5,
	PATTERN110 : 6,
	PATTERN111 : 7
};

};
modules["QRMath"]=function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),

                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {

				}
			}		
		}

	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {

	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);

				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {

			} else if (v < 8) {

			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

			mod = (!test && ( (bits >> h) & 1) === 1);

						}

						}
					}
				}

					row -= inc;
					inc = -inc;

				}
			}
		}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

async function processTicketQr(raw){if(!requireAccess('scan','update'))return;const result=validateTicketQr(expandManualTicketCode(raw));state.scanResult=result;state.scanError='';if(result.ok){recordTicketCheckin(result);state.scanResult={...result,checked:true};toast('Check-in berhasil. Tiket valid dan sudah digunakan.')}else{toast(result.title,true)}render()}
let scannerPending=false,decoderTask=null,lastDecodeAttempt=0,scanNotFoundCount=0;
function loadJsQrDecoder(){
 if(window.jsQR)return Promise.resolve(window.jsQR);
 if(decoderTask)return decoderTask;
 decoderTask=new Promise((resolve,reject)=>{
  const urls=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
  let i=0;
  const loadNext=()=>{if(i>=urls.length)return reject(Error('Decoder cadangan tidak dapat dimuat. Pastikan perangkat terhubung internet atau gunakan input kode manual.'));
   const script=document.createElement('script');script.src=urls[i++];script.async=true;
   script.onload=()=>window.jsQR?resolve(window.jsQR):loadNext();script.onerror=loadNext;document.head.appendChild(script);
  };loadNext();
 }).catch(err=>{decoderTask=null;throw err});
 return decoderTask;
}
function scanCanvasDecode(video){
 const canvas=scanCanvasDecode.canvas||(scanCanvasDecode.canvas=document.createElement('canvas'));
 const w=video.videoWidth,h=video.videoHeight;
 if(!w||!h)return null;
 const scale=Math.min(1,720/Math.max(w,h));canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);
 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
 return window.jsQR?.(pixels.data,pixels.width,pixels.height,{inversionAttempts:'attemptBoth'})?.data||null;
}
async function beginScanner(){
 if(!state.scanOpen||state.page!=='admin'||state.adminTab!=='scan'||scanStream||scannerPending)return;
 const video=$('scannerVideo');if(!video)return;
 const generation=++scanGeneration;scannerPending=true;
 const update=t=>{const el=$('scanStatus');if(el)el.textContent=t};
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Akses kamera tidak tersedia. Gunakan HTTPS atau localhost, atau masukkan QR secara manual.');
  update('Membuka kamera dan menyiapkan pembaca QR...');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  if(generation!==scanGeneration||!state.scanOpen||state.adminTab!=='scan'){stream.getTracks().forEach(t=>t.stop());return}
  scanStream=stream;video.srcObject=stream;await video.play();
  let nativeAvailable=false;
  if('BarcodeDetector' in window){try{const formats=window.BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():['qr_code'];if(formats.includes('qr_code')){scanDetector=new BarcodeDetector({formats:['qr_code']});nativeAvailable=true}}catch(e){}}
  if(!nativeAvailable){update('Kamera aktif. Memuat mesin pembaca QR cadangan...');try{await loadJsQrDecoder()}catch(err){update(err.message);return}}
  else{loadJsQrDecoder().catch(()=>{});} // jalankan decoder kedua saat tersedia untuk akurasi lebih baik
  if(generation!==scanGeneration)return;
  update('Scanner aktif. Posisikan QR tiket di dalam area kamera, tahan stabil 1–2 detik.');
  scanNotFoundCount=0;
  const loop=async()=>{
   if(generation!==scanGeneration||!state.scanOpen||state.adminTab!=='scan'||!scanStream)return;
   if(scanLoopBusy){requestAnimationFrame(loop);return}scanLoopBusy=true;
   let raw=null;
   try{
    if(video.readyState>=2&&video.videoWidth){
     if(scanDetector){try{const codes=await scanDetector.detect(video);raw=codes?.find(c=>c.format==='qr_code'||!c.format)?.rawValue||null}catch(err){scanDetector=null}}
     if(!raw&&window.jsQR&&performance.now()-lastDecodeAttempt>115){lastDecodeAttempt=performance.now();raw=scanCanvasDecode(video)}
    }
    if(raw){stopScanner();state.scanOpen=false;await processTicketQr(raw);return}
    scanNotFoundCount++;
    if(scanNotFoundCount===150)update('QR belum terbaca. Dekatkan QR, kurangi pantulan layar dan atur fokus kamera. Anda juga bisa unggah gambar QR.');
   }catch(err){update('Pembacaan QR terganggu: '+(err.message||'coba kamera lain atau unggah foto QR.'))}
   finally{scanLoopBusy=false}
   if(generation===scanGeneration&&state.scanOpen)requestAnimationFrame(loop)
  };
  requestAnimationFrame(loop);
 }catch(err){if(generation!==scanGeneration)return;state.scanError=err.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan akses kamera pada browser.':err.name==='NotFoundError'?'Tidak ada kamera yang ditemukan.':err.message||'Kamera gagal dibuka.';update(state.scanError)}
 finally{scannerPending=false}
}
async function scanImageFile(file){
 if(!requireAccess('scan','update'))return;
 const status=$('scanStatus');const msg=t=>{if(status)status.textContent=t};
 if(!file||!file.type.startsWith('image/'))return toast('Pilih file gambar QR (JPG, PNG, atau WebP).',true);
 if(file.size>10_000_000)return toast('Gambar terlalu besar (maksimum 10 MB).',true);
 msg('Memeriksa QR dari gambar...');
 try{
  const img=await createImageBitmap(file);let raw=null;
  if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const found=await detector.detect(img);raw=found?.[0]?.rawValue||null}catch(e){}}
  if(!raw){const jsqr=await loadJsQrDecoder();const canvas=document.createElement('canvas');const scale=Math.min(1,1400/Math.max(img.width,img.height));canvas.width=Math.ceil(img.width*scale);canvas.height=Math.ceil(img.height*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);raw=jsqr(pixels.data,pixels.width,pixels.height,{inversionAttempts:'attemptBoth'})?.data||null}
  img.close();
  if(!raw){msg('QR tidak ditemukan pada gambar. Gunakan foto yang tajam dan pastikan seluruh QR terlihat.');return}
  stopScanner();state.scanOpen=false;await processTicketQr(raw);
 }catch(err){msg('Gagal membaca gambar: '+(err.message||'format tidak didukung.'))}
}

function promoForm(){let p=db.promos.find(x=>x.id===state.editing)||{code:'',discount:'',minSpend:0,quota:100,status:'ACTIVE'};return `<section class="panel editing"><div class="panel-head"><h2>${state.editing?'Edit Promo':'Tambah Promo Baru'}</h2><button class="btn ghost sm" data-action="closeEditor">Tutup ✕</button></div><form id="promoForm"><div class="form-grid"><label class="field">Kode Promo<input name="code" required maxlength="24" value="${esc(p.code)}" placeholder="CONTOH20"></label><label class="field">Potongan Nominal (Rp)<input name="discount" type="number" min="1" step="1000" required value="${esc(p.discount)}"></label><label class="field">Minimal Belanja (Rp)<input name="minSpend" type="number" min="0" step="1000" required value="${esc(p.minSpend)}"></label><label class="field">Kuota Penggunaan<input name="quota" type="number" min="1" step="1" required value="${esc(p.quota)}"></label><label class="field">Status<select name="status"><option value="ACTIVE" ${p.status==='ACTIVE'?'selected':''}>Aktif</option><option value="INACTIVE" ${p.status==='INACTIVE'?'selected':''}>Nonaktif</option></select></label></div><div class="form-actions"><button type="button" class="btn ghost" data-action="closeEditor">Batal</button><button class="btn" type="submit">Simpan Promo</button></div></form></section>`}
function promoPanel(){return `<div class="section-head"><div><h2>Promo & Voucher</h2><p>Atur potongan harga, minimum belanja, kuota, dan status voucher.</p></div><button class="btn" data-action="addPromo" ${!can('promos','create')?'disabled':''}>＋ Tambah Promo</button></div>${state.editing!==null&&state.editingType==='promo'?promoForm():''}<section class="panel"><div class="table-scroll"><table class="table"><thead><tr><th>Kode</th><th>Diskon</th><th>Min. Belanja</th><th>Penggunaan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.promos.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${rupiah(p.discount)}</td><td>${rupiah(p.minSpend)}</td><td>${p.used||0} / ${p.quota}</td><td>${statusBadge(p.status)}</td><td><div class="stack"><button class="btn soft sm" data-edit-promo="${esc(p.id)}">Edit</button><button class="btn ghost sm" data-toggle-promo="${esc(p.id)}">${p.status==='ACTIVE'?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger sm" data-delete-promo="${esc(p.id)}">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="6">Belum ada promo.</td></tr>'}</tbody></table></div></section>`}
function transactionPanel(){let tx=[...db.transactions].reverse().filter(o=>(state.statusFilter==='ALL'||o.status===state.statusFilter)&&`${o.id} ${o.ticketName} ${o.payment} ${o.paymentRef}`.toLowerCase().includes(state.search.toLowerCase()));return `<div class="section-head"><div><h2>Riwayat Transaksi & Pembayaran</h2><p>Konfirmasi pembayaran customer dari satu tempat.</p></div><button class="btn ghost" data-action="export">↓ Ekspor JSON</button></div><div class="notice"><b>Logika demo:</b> QRIS dan E-Wallet membuat instruksi pembayaran dummy dan tetap PENDING. Kasir menerima nomor pesanan. Setelah pembayaran benar-benar diterima di kasir, operator menekan <b>Tandai Paid</b>. Hanya transaksi PAID yang dapat lolos scan tiket.</div><section class="panel"><div class="toolbar"><input class="search" id="tableSearch" value="${esc(state.search)}" placeholder="Cari kode order / tiket / ref..."><select class="search" id="filterStatus" style="width:175px"><option value="ALL">Semua Status</option><option value="PENDING" ${state.statusFilter==='PENDING'?'selected':''}>Pending</option><option value="PAID" ${state.statusFilter==='PAID'?'selected':''}>Paid</option><option value="CANCELLED" ${state.statusFilter==='CANCELLED'?'selected':''}>Cancelled</option></select><span class="badge">${tx.length} Transaksi</span></div><div class="table-scroll"><table class="table"><thead><tr><th>Order</th><th>Waktu</th><th>Tiket</th><th>Qty</th><th>Total</th><th>Metode</th><th>Referensi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${tx.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${date(o.createdAt)}</td><td>${esc(o.ticketName)}</td><td>${o.qty}</td><td>${rupiah(o.total)}</td><td>${esc(o.payment)}</td><td><span class="print-code" style="font-size:10px">${esc(o.paymentRef||'-')}</span></td><td>${statusBadge(o.status)}</td><td><div class="stack">${o.status==='PENDING'?`<button class="btn soft sm" data-order-status="${esc(o.id)}" data-status="PAID">✓ Tandai Paid</button><button class="btn danger sm" data-order-status="${esc(o.id)}" data-status="CANCELLED">Batalkan</button>`:`<span class="muted">${o.paidAt?`Dikonfirmasi ${date(o.paidAt)} oleh ${esc(o.paidBy||'Operator')}`:'Tidak ada aksi'}</span>`}</div></td></tr>`).join('')}</tbody></table></div></section>`}

function paymentPanel(){return `<section class="panel" style="max-width:760px"><h2>Metode Pembayaran Customer</h2><p class="muted">Aktifkan metode yang akan ditampilkan pada halaman pembayaran customer.</p>${[['qris','QRIS','QR berbasis kode demo, bukan QRIS merchant nyata'],['wallet','E-Wallet','Metode dompet digital dalam mode demonstrasi'],['cash','Kasir / Tunai','Pembayaran diterima dan diverifikasi operator']].map(([k,title,desc])=>`<div class="switch-row"><div><b>${title}</b><div class="inline-help">${desc}</div></div><button class="toggle ${db.payment[k]?'on':''}" data-pay-toggle="${k}" aria-pressed="${db.payment[k]}">${db.payment[k]?'Aktif':'Nonaktif'}</button></div>`).join('')}<div class="alert" style="margin-top:20px">Pengaturan ini hanya mengatur pilihan yang ditampilkan, belum menghubungkan payment gateway atau printer.</div></section>`}
function contentPanel(){let c=db.content;return `<div class="two-cols"><section class="panel"><div class="panel-head"><h2>Editor Halaman Customer</h2><span class="badge green">Terhubung ke etalase</span></div><p class="muted">Ubah informasi utama halaman beranda tanpa menyunting HTML secara manual.</p><div class="help-box" style="margin-bottom:15px">Banner beranda mendukung JPG, PNG, dan WebP. Gambar otomatis diperkecil agar dapat disimpan di browser lokal.</div><label class="field">Upload gambar utama (hero)<input id="heroUpload" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="image-preview" style="margin:12px 0 9px">${c.heroImage?`<img src="${c.heroImage}" alt="Preview banner customer">`:'Belum ada gambar banner'}</div><div class="stack" style="margin-bottom:20px"><button class="btn danger sm" data-action="removeHero" ${!c.heroImage?'disabled':''}>Hapus Gambar</button><small>Rekomendasi rasio 16:9. Maksimum file asli 8 MB.</small></div><form id="contentForm"><div style="display:grid;gap:15px"><label class="field">Posisi Gambar<select name="heroPosition">${['center','top','bottom'].map(x=>`<option value="${x}" ${c.heroPosition===x?'selected':''}>${{center:'Tengah',top:'Atas',bottom:'Bawah'}[x]}</option>`).join('')}</select></label><label class="field">Nama Brand<input name="brand" required maxlength="30" value="${esc(c.brand)}"></label><label class="field">Judul Utama<input name="headline" required maxlength="80" value="${esc(c.headline)}"></label><label class="field">Deskripsi Hero<textarea name="subheadline" maxlength="250">${esc(c.subheadline)}</textarea></label><label class="field">Teks Tombol CTA<input name="cta" required maxlength="35" value="${esc(c.cta)}"></label><label class="field">Teks Pengumuman<input name="announcement" maxlength="140" value="${esc(c.announcement)}"></label></div><div class="form-actions"><button type="submit" class="btn">Simpan Perubahan</button></div></form></section><section class="panel"><div class="panel-head"><h2>Pratinjau Konten</h2><button class="btn soft sm" data-nav="home">Buka Customer ↗</button></div><div style="padding:25px;border-radius:14px;color:#fff;background:${c.heroImage?`linear-gradient(90deg,#11213fcc,#11213f55),url('${c.heroImage}') ${esc(c.heroPosition||'center')}/cover`:'linear-gradient(115deg,#11213f,#2866bc)'}"><div style="font-size:12px;opacity:.8">${esc(c.brand)}</div><h2 style="font-size:27px;margin:25px 0 12px">${esc(c.headline)}</h2><p style="font-size:13px;color:#dbe8ff">${esc(c.subheadline)}</p><span style="display:inline-block;background:white;color:#183a78;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:750">${esc(c.cta)}</span></div><p class="foot-note">Pratinjau memakai konten yang sudah disimpan. Semua tiket berstatus aktif juga otomatis ditampilkan pada halaman customer.</p></section></div>`}
function usersPanel(){let editing=db.users.find(u=>u.id===state.editing);return `<div class="section-head"><div><h2>Manajemen Pengguna</h2><p>Atur akun dan role pengguna admin yang tersimpan di browser ini.</p></div>${can('users','create')?`<button class="btn" data-action="addUser">＋ Tambah Pengguna</button>`:''}</div><div class="notice">Role membatasi tampilan dan perubahan data dalam aplikasi demo ini. Validasi tiket dilakukan melalui menu Scan Tiket. Untuk produksi tetap gunakan autentikasi dan otorisasi server.</div>${state.editingType==='user'?`<section class="panel editing"><div class="panel-head"><h2>${editing?'Edit Pengguna':'Tambah Pengguna'}</h2><button class="btn ghost sm" data-action="closeEditor">Tutup ✕</button></div><form id="userForm"><div class="form-grid"><label class="field">Nama lengkap<input required name="name" maxlength="60" value="${esc(editing?.name||'')}"></label><label class="field">Username<input required name="username" autocomplete="off" pattern="[a-zA-Z0-9._-]{3,30}" title="3–30 karakter: huruf, angka, titik, garis bawah, atau tanda minus" value="${esc(editing?.username||'')}"></label><label class="field">Role<select name="role">${Object.entries(db.roles).map(([key,val])=>`<option value="${key}" ${editing?.role===key?'selected':''}>${val.label}</option>`).join('')}</select></label><label class="field">Status<select name="active"><option value="true" ${editing?.active!==false?'selected':''}>Aktif</option><option value="false" ${editing?.active===false?'selected':''}>Nonaktif</option></select></label><label class="field" style="grid-column:1/-1">Password ${editing?'baru (kosongkan untuk mempertahankan password lama)':''}<input type="password" name="password" minlength="8" ${editing?'':'required'} autocomplete="new-password" placeholder="Minimal 8 karakter"></label></div><div class="form-actions"><button type="button" class="btn ghost" data-action="closeEditor">Batal</button><button type="submit" class="btn">Simpan Pengguna</button></div></form></section>`:''}<section class="panel"><div class="table-scroll"><table class="table"><thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td><span class="role-pill">${esc(roleName(u.role))}</span></td><td>${statusBadge(u.active?'ACTIVE':'INACTIVE')}</td><td><button class="btn soft sm" data-edit-user="${esc(u.id)}" ${!can('users','update')?'disabled':''}>Edit</button> <button class="btn danger sm" data-delete-user="${esc(u.id)}" ${u.id===state.currentUser?.id||!can('users','delete')?'disabled':''}>Hapus</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel" style="margin-top:18px"><h2>Pengaturan Role</h2><p class="muted">Buat dan kelola hak akses Create, Read, Update, Delete per menu pada halaman <b>Role & Akses</b>.</p><button class="btn soft" data-tab="roles">Buka Manajemen Role →</button></section>`}
function reportsPanel(){const from=state.reportFrom,to=state.reportTo,status=state.reportStatus,method=state.reportMethod;
const tx=db.transactions.filter(o=>{const d=(o.createdAt||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to)&&(status==='ALL'||o.status===status)&&(method==='ALL'||o.payment===method)});
const paid=tx.filter(o=>o.status==='PAID'),revenue=paid.reduce((a,o)=>a+Number(o.total||0),0),packs=paid.reduce((a,o)=>a+Number(o.qty||0),0);
const methods=[...new Set(db.transactions.map(o=>o.payment).filter(Boolean))];
const grouped={};for(const o of tx){const d=(o.createdAt||'').slice(0,10)||'Tanpa tanggal';if(!grouped[d])grouped[d]={orders:0,paid:0,total:0,qty:0};grouped[d].orders++;if(o.status==='PAID'){grouped[d].paid++;grouped[d].total+=Number(o.total||0);grouped[d].qty+=Number(o.qty||0)}}
const rows=Object.entries(grouped).sort((a,b)=>b[0].localeCompare(a[0]));
return `<div class="section-head"><div><h2>Laporan Penjualan & Operasional</h2><p>Ringkasan pembayaran, tiket, dan check-in berdasarkan data lokal.</p></div>${can('reports','read')?`<button class="btn" data-action="exportReport">↓ Download CSV</button>`:''}</div><section class="panel"><div class="form-grid" style="grid-template-columns:repeat(4,minmax(120px,1fr))"><label class="field">Dari tanggal<input id="reportFrom" type="date" value="${esc(from)}"></label><label class="field">Sampai tanggal<input id="reportTo" type="date" value="${esc(to)}"></label><label class="field">Status<select id="reportStatus">${['ALL','PENDING','PAID','CANCELLED'].map(x=>`<option value="${x}" ${status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Metode<select id="reportMethod"><option value="ALL">Semua metode</option>${methods.map(m=>`<option value="${esc(m)}" ${method===m?'selected':''}>${esc(m)}</option>`).join('')}</select></label></div></section><div class="metric-grid" style="margin-top:18px"><div class="panel metric"><small>Omzet Terbayar</small><div class="num">${rupiah(revenue)}</div></div><div class="panel metric"><small>Total Pesanan</small><div class="num">${tx.length}</div></div><div class="panel metric"><small>Pesanan Lunas</small><div class="num">${paid.length}</div></div><div class="panel metric"><small>Pack Terjual</small><div class="num">${packs}</div></div></div><section class="panel" style="margin-top:18px"><h2>Rekap Per Hari</h2><div class="table-scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Pesanan</th><th>Lunas</th><th>Pack Terjual</th><th>Omzet</th></tr></thead><tbody>${rows.map(([d,v])=>`<tr><td>${esc(d)}</td><td>${v.orders}</td><td>${v.paid}</td><td>${v.qty}</td><td>${rupiah(v.total)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada data pada filter ini.</td></tr>'}</tbody></table></div></section><section class="panel" style="margin-top:18px"><h2>Rekap Transaksi Detail</h2><div class="table-scroll"><table class="table"><thead><tr><th>Waktu</th><th>Kode</th><th>Tiket</th><th>Pack</th><th>Metode</th><th>Total</th><th>Status</th></tr></thead><tbody>${tx.slice().reverse().map(o=>`<tr><td>${date(o.createdAt)}</td><td>${esc(o.id)}</td><td>${esc(o.ticketName)}</td><td>${o.qty}</td><td>${esc(o.payment)}</td><td>${rupiah(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join('')||'<tr><td colspan="7">Tidak ada transaksi.</td></tr>'}</tbody></table></div></section>`}
function exportReport(){if(!requireAccess('reports','read'))return;const tx=db.transactions.filter(o=>{const d=(o.createdAt||'').slice(0,10);return (!state.reportFrom||d>=state.reportFrom)&&(!state.reportTo||d<=state.reportTo)&&(state.reportStatus==='ALL'||o.status===state.reportStatus)&&(state.reportMethod==='ALL'||o.payment===state.reportMethod)});const escCsv=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const columns=['Tanggal','ID Order','Tiket','Pack','Metode','Referensi','Subtotal','Diskon','Total','Status'];const lines=[columns.join(','),...tx.map(o=>[o.createdAt,o.id,o.ticketName,o.qty,o.payment,o.paymentRef,o.subtotal,o.discount,o.total,o.status].map(escCsv).join(','))];downloadBlob(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'mkios-laporan-'+new Date().toISOString().slice(0,10)+'.csv')}
function rolesPanel(){const editing=db.roles[state.editingRole]||null,perms=editing?.permissions||{},all=Object.values(db.roles);
return `<div class="section-head"><div><h2>Manajemen Role & Hak Akses</h2><p>Role dapat dibuat sendiri, lalu atur CRUD untuk setiap menu.</p></div>${can('roles','create')?`<button class="btn" data-action="addRole">＋ Buat Role</button>`:''}</div><div class="notice">Role <b>Super Admin</b> adalah role sistem yang tidak dapat dihapus atau dikurangi hak aksesnya. Izin <b>Read</b> diperlukan agar menu dapat ditampilkan. Role custom dapat digunakan pada form Pengguna.</div>${state.editingRole!==null?`<section class="panel editing"><h2>${editing?'Edit Role':'Buat Role Baru'}</h2><form id="roleForm"><label class="field">Nama Role<input required name="label" maxlength="50" value="${esc(editing?.label||'')}" placeholder="Contoh: Supervisor Kasir"></label><div class="table-scroll" style="margin-top:18px"><table class="table"><thead><tr><th>Menu</th><th>Create</th><th>Read</th><th>Update</th><th>Delete</th></tr></thead><tbody>${menus.map(([id,,label])=>`<tr><td><b>${esc(label)}</b></td>${CRUD.map(op=>`<td><input type="checkbox" name="perm_${id}_${op}" ${perms[id]?.[op]?'checked':''} ${editing?.id==='superadmin'?'disabled':''} aria-label="${esc(op)} ${esc(label)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint">Mencentang Create, Update, atau Delete otomatis memberikan izin Read untuk menu tersebut.</p><div class="form-actions"><button class="btn ghost" type="button" data-action="cancelRole">Batal</button><button class="btn" type="submit" ${editing?.id==='superadmin'?'disabled':''}>Simpan Role</button></div></form></section>`:''}<section class="panel"><div class="table-scroll"><table class="table"><thead><tr><th>Role</th><th>Pengguna</th><th>Menu Terlihat</th><th>Aksi</th></tr></thead><tbody>${all.map(r=>`<tr><td><b>${esc(r.label)}</b> ${r.system?'<span class="badge">Bawaan</span>':''}</td><td>${db.users.filter(u=>u.role===r.id).length}</td><td>${Object.values(r.permissions||{}).filter(p=>p.read).length}</td><td><div class="stack">${can('roles','update')?`<button class="btn soft sm" data-edit-role="${esc(r.id)}" ${r.id==='superadmin'?'disabled':''}>Edit Izin</button>`:''}${can('roles','delete')&&!r.system?`<button class="btn danger sm" data-delete-role="${esc(r.id)}">Hapus</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></section>`}
function settingsPanel(){return `<section class="panel" style="max-width:800px"><h2>Pengaturan & Data Lokal</h2><p class="muted">Aplikasi contoh ini menyimpan konfigurasi pada localStorage browser yang sedang digunakan.</p><div class="notice">Data tidak otomatis tersinkron ke perangkat lain. Untuk lingkungan produksi diperlukan API, database server, autentikasi, dan sistem pembayaran resmi.</div><div class="stack"><button class="btn" data-action="export">↓ Unduh Backup JSON</button><label class="btn ghost" style="cursor:pointer">↑ Impor Backup JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label></div><div class="divider"></div><h3>Ringkasan Penyimpanan</h3><p class="muted">${db.tickets.length} tiket, ${db.promos.length} promo, ${db.transactions.length} transaksi.</p><p class="foot-note">Mengimpor backup mengganti data lokal setelah validasi struktur dasar.</p></section>`}
function customerPage(){document.body.classList.remove('read-only');const brand=esc(db.content.brand);const nav=`<header class="customer-nav"><div class="brand"><span class="brand-logo">◈</span>${brand}</div><div class="stack"><button class="btn ghost sm" data-nav="home">Beranda</button><button class="btn soft sm" data-nav="print">Cari Tiket</button></div></header>`;let content=state.page==='home'?home():state.page==='ticket'?shop():state.page==='review'?review():state.page==='payment'?checkout():state.page==='success'?success():printPage();return `<div class="customer">${nav}<main class="customer-container">${content}</main><button title="Akses operator" aria-label="Masuk admin" class="admin-only-icon" data-action="openAdmin">⚙</button></div>`}
function home(){return `<div class="hero ${db.content.heroImage?'has-image':''}" style="${db.content.heroImage?`background-image:linear-gradient(90deg,rgba(11,25,50,.88),rgba(11,25,50,.28)),url('${db.content.heroImage}');background-position:${esc(db.content.heroPosition||'center')}`:''}"><div class="eyebrow" style="color:#b9d8ff">${esc(db.content.announcement)}</div><h1>${esc(db.content.headline)}</h1><p>${esc(db.content.subheadline)}</p><button class="btn" data-nav="ticket">${esc(db.content.cta)} →</button></div><div class="customer-cards"><div class="panel"><h3>01. Pilih Tiket</h3><p class="muted">Pilih jenis dan jumlah tiket yang tersedia.</p></div><div class="panel"><h3>02. Pilih Pembayaran</h3><p class="muted">Tentukan metode pembayaran yang diaktifkan operator.</p></div><div class="panel"><h3>03. Cetak Tiket QR</h3><p class="muted">Setiap pack yang telah dibayar mendapat QR unik yang bisa dipreview, dicetak, dan diunduh.</p></div></div><p class="foot-note">Mode demonstrasi. Transaksi dan konfirmasi pembayaran belum terhubung ke sistem keuangan.</p>`}
function currentTicket(){return activeTickets().find(t=>t.id===state.selected)||activeTickets()[0]}
function promoFor(t,qty){const p=db.promos.find(x=>x.code.toUpperCase()===state.applied?.toUpperCase()&&x.status==='ACTIVE'&&(x.used||0)<x.quota&&t.price*qty>=x.minSpend);return p||null}
function totals(){let t=currentTicket();let subtotal=t?t.price*state.qty:0;let promo=t?promoFor(t,state.qty):null;let discount=promo?Math.min(promo.discount,subtotal):0;return {t,subtotal,promo,discount,total:subtotal-discount}}
function progress(n){return `<div class="progress">${['Pilih Tiket','Konfirmasi','Pembayaran','Selesai'].map((x,i)=>`<span class="${i<=n?'on':''}">${i+1}. ${x}</span>`).join('')}</div>`}
function shop(){const tks=activeTickets();if(!tks.length)return `${progress(0)}<div class="panel">${empty('Belum ada tiket tersedia','Operator dapat mengaktifkan tiket melalui dashboard.')}</div>`;let {t,subtotal,discount,total}=totals();return `${progress(0)}<div class="section-head"><div><h1>Pilih Tiket</h1><p class="muted">Pilih pengalaman yang Anda inginkan.</p></div></div><div class="shop-grid"><div class="ticket-options">${tks.map(tk=>`<button class="ticket-option ${t.id===tk.id?'chosen':''}" data-choose-ticket="${esc(tk.id)}"><div class="ticket-icon">${esc(tk.icon)}</div><strong>${esc(tk.name)}</strong><div class="muted" style="font-size:12px;margin-top:8px">${esc(tk.description)}</div><div class="price">${rupiah(tk.price)}</div></button>`).join('')}</div><aside class="panel order-summary"><h2>Ringkasan Pesanan</h2><p class="muted">${esc(t.name)}</p><div class="summary-line"><span>Jumlah tiket</span><div class="qty-control"><button data-action="minusQty">−</button><b>${state.qty}</b><button data-action="plusQty">+</button></div></div><form id="applyPromo"><label class="field">Kode Voucher<input name="promo" placeholder="Contoh: HEMAT10" value="${esc(state.promo)}"></label><button class="btn soft sm" style="margin-top:9px" type="submit">Gunakan Voucher</button></form>${state.error?`<p class="error-text">${esc(state.error)}</p>`:''}${state.applied?`<div class="hint" style="margin-top:10px">Promo dipakai: <b>${esc(state.applied)}</b> <button class="btn sm ghost" data-action="removePromo">Hapus</button></div>`:''}<div class="divider"></div><div class="summary-line"><span>Subtotal</span><b>${rupiah(subtotal)}</b></div><div class="summary-line"><span>Diskon</span><b>− ${rupiah(discount)}</b></div><div class="summary-line total"><span>Total</span><span>${rupiah(total)}</span></div><button class="btn wide" data-nav="review" style="margin-top:12px">Lanjutkan →</button></aside></div>`}
function review(){let {t,subtotal,discount,total}=totals();if(!t)return shop();return `${progress(1)}<section class="panel" style="max-width:710px;margin:auto"><h1>Konfirmasi Pesanan</h1><p class="muted">Periksa ringkasan sebelum memilih pembayaran.</p><div class="divider"></div><div class="summary-line"><span>Tiket</span><b>${esc(t.name)}</b></div><div class="summary-line"><span>Jumlah</span><b>${state.qty}</b></div><div class="summary-line"><span>Subtotal</span><b>${rupiah(subtotal)}</b></div><div class="summary-line"><span>Diskon</span><b>− ${rupiah(discount)}</b></div><div class="divider"></div><div class="summary-line total"><span>Total</span><span>${rupiah(total)}</span></div><div class="stack" style="justify-content:flex-end;margin-top:22px"><button class="btn ghost" data-nav="ticket">← Kembali</button><button class="btn" data-nav="payment">Pilih Pembayaran →</button></div></section>`}
function checkout(){let {t,total}=totals();if(!t)return shop();let methods=[['qris','QRIS','Pembayaran QR'],['wallet','E-Wallet','Dompet Digital'],['cash','Kasir / Tunai','Pembayaran di lokasi']].filter(x=>db.payment[x[0]]);const digital=state.method==='qris'||state.method==='wallet';return `${progress(2)}<section class="panel" style="max-width:820px;margin:auto"><h1>Pembayaran</h1><p class="muted">Total tagihan: <b>${rupiah(total)}</b>. Pilih metode pembayaran untuk menyelesaikan pesanan demo.</p>${methods.length?`<div class="payment-options">${methods.map(([k,title,desc])=>`<button class="payment-choice ${state.method===k?'chosen':''}" data-method="${k}"><b>${title}</b><div class="hint">${desc}</div></button>`).join('')}</div>${state.method?paymentMethodPreview(state.method,total,t,state.qty):`<div class="notice" style="margin-top:18px">Pilih salah satu metode pembayaran untuk menampilkan simulasi.</div>`}<div class="stack" style="justify-content:flex-end;margin-top:20px"><button class="btn ghost" data-nav="review">← Kembali</button>${digital?`<button class="btn" data-action="confirmDigitalPayment" ${!state.method?'disabled':''}>✓ Konfirmasi Pembayaran & Selesaikan</button>`:`<button class="btn" data-action="placeOrder" ${!state.method?'disabled':''}>Buat Pesanan untuk Kasir →</button>`}</div>${digital?`<div class="hint" style="margin-top:10px;text-align:right">Mode simulasi: tombol konfirmasi langsung mengubah transaksi menjadi <b>PAID</b> dan membuka tiket QR.</div>`:`<div class="hint" style="margin-top:10px;text-align:right">Kasir: pesanan dibuat <b>PENDING</b>. Status dibayar diperbarui oleh operator melalui Dashboard Admin.</div>`}`:`<div class="alert">Metode pembayaran belum tersedia. Silakan hubungi operator.</div><button class="btn ghost" data-nav="review">Kembali</button>`}</section>`}

function success(){let o=db.transactions.find(x=>x.id===state.orderId);if(!o)return home();return `${progress(3)}<section class="panel success-card"><div class="success-mark">✓</div><h1>Pesanan Berhasil Dibuat</h1><p>Pesanan tersimpan dengan status ${statusBadge(o.status)}.</p><div class="print-code">${esc(o.id)}</div><p><b>${esc(o.ticketName)}</b> × ${o.qty}<br>Total ${rupiah(o.total)}<br>Metode ${esc(o.payment)}<br>Referensi ${esc(o.paymentRef||'-')}</p>${o.payment==='QRIS'?`<div class="notice">QRIS simulasi sudah dibuat. Pembayaran belum dianggap lunas sampai status transaksi diubah menjadi PAID.</div>`:o.payment==='E-Wallet'?`<div class="notice">Kode E-Wallet simulasi: <b>${esc(o.paymentRef)}</b>. Pembayaran belum dianggap lunas sampai status transaksi diubah menjadi PAID.</div>`:`<div class="notice">Pembayaran dilakukan di kasir. Tunjukkan nomor pesanan <b>${esc(o.id)}</b>. Setelah uang diterima, operator mengubah status menjadi PAID di dashboard admin.</div>`}<div class="divider"></div>${ticketPreviewMarkup(o,{showActions:true})}<div class="stack" style="justify-content:center;margin-top:20px"><button class="btn" data-nav="print">Cari / Cetak Tiket</button><button class="btn ghost" data-nav="home">Beranda</button></div></section>`}
function printPage(){let code=state.printSearch||state.orderId||'';let o=db.transactions.find(x=>x.id.toUpperCase()===code.trim().toUpperCase());const count=o?Math.max(0,Math.min(99,Math.floor(Number(o.qty)||0))):0;const paid=o?.status==='PAID';return `${progress(3)}<section class="panel print-screen"><h1>Cari & Lihat Tiket</h1><p class="muted print-search-description">Masukkan nomor pesanan untuk menampilkan detail dan QR tiket per pack.</p><form id="printForm" class="stack"><input name="code" class="search" style="flex:1;min-width:220px" placeholder="Contoh: ORD-MK-..." value="${esc(code)}" required><button class="btn" type="submit">Cari Pesanan</button></form>${state.error?`<p class="error-text">${esc(state.error)}</p>`:''}${o?`<div class="notice no-print" style="margin-top:18px"><b>${esc(o.id)}</b> · ${esc(o.ticketName)} · ${count} pack · ${statusBadge(o.status)}<div class="hint">QR tiket ditampilkan satu per pack. QR tetap tersimpan untuk pesanan yang sama.</div></div>${!paid?`<div class="alert no-print">${o.status==='CANCELLED'?'Pesanan dibatalkan. QR tidak dapat digunakan.':'Pembayaran masih PENDING. QR dapat dipreview, tetapi check-in wahana akan ditolak sampai status PAID.'}</div>`:`<div class="print-tools"><button class="btn" data-action="print">🖨 Cetak ${count} Tiket</button><span class="muted">Total ${count} tiket untuk ${count} pack.</span></div>`}<div class="ticket-print-sheet">${Array.from({length:count},(_,i)=>{const serial=ticketQrSerial(o,i),qr=makeQrSvg(ticketQrPayload(o,i),230);return `<article class="print-ticket"><div class="eyebrow">${esc(db.content.brand)} • TIKET MASUK</div><h2 style="margin:11px 0 5px">${esc(o.ticketName)}</h2><small>Pack ${i+1} dari ${count}</small><div class="qr-box">${qr}</div><div class="barcode-text">${esc(serial)}</div><div class="divider" style="margin:12px 0"></div><div class="summary-line"><span>Nomor pesanan</span><b style="font-size:11px">${esc(o.id)}</b></div><div class="summary-line"><span>Tanggal</span><b>${date(o.createdAt)}</b></div><div class="summary-line"><span>Status</span><b>${esc(o.status)}</b></div><small>${paid?'QR berlaku untuk 1 pack. Tunjukkan QR kepada petugas untuk validasi masuk.':'QR hanya preview sampai pembayaran PAID.'}</small>${paid?`<div class="ticket-actions no-print"><button class="btn soft sm" data-download-ticket="${esc(o.id)}" data-ticket-index="${i}">↓ Unduh PNG</button></div>`:''}</article>`}).join('')}</div>${paid?`<div class="stack no-print" style="justify-content:center;margin-top:18px"><button class="btn" data-action="print">🖨 Cetak Semua Tiket</button></div>`:''}`:code&&state.printSearch?`<div class="empty">Pesanan tidak ditemukan pada penyimpanan browser ini.</div>`:''}</section>`}

function refreshTable(){const el=$('tableSearch');if(el){let pos=el.selectionStart;render();let next=$('tableSearch');if(next){next.focus();next.setSelectionRange(pos,pos)}}else render()}
function ensureEditing(type,id){state.editingType=type;state.editing=id;state.page='admin';state.adminTab=type==='ticket'?'tickets':'promos';render();setTimeout(()=>document.querySelector('.editing input')?.focus(),0)}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-action],button[data-nav],button[data-tab],button[data-choose-ticket],button[data-method],button[data-edit-ticket],button[data-delete-ticket],button[data-toggle-ticket],button[data-edit-promo],button[data-delete-promo],button[data-toggle-promo],button[data-pay-toggle],button[data-order-status],button[data-edit-user],button[data-delete-user],button[data-download-ticket],button[data-edit-role],button[data-delete-role]');if(!btn)return;
if(btn.dataset.nav){if(btn.dataset.nav==='review'&&!currentTicket())return toast('Tidak ada tiket aktif.',true);if(btn.dataset.nav==='payment'&&!currentTicket())return toast('Pilih tiket terlebih dahulu.',true);navigate(btn.dataset.nav);return}if(btn.dataset.tab){admin(btn.dataset.tab);return}const targetEdit=btn.dataset.editTicket||btn.dataset.deleteTicket||btn.dataset.toggleTicket?'tickets':btn.dataset.editPromo||btn.dataset.deletePromo||btn.dataset.togglePromo?'promos':btn.dataset.payToggle?'payment':btn.dataset.orderStatus?'transactions':btn.dataset.editUser||btn.dataset.deleteUser?'users':null;if(targetEdit){const act=btn.dataset.deleteTicket||btn.dataset.deletePromo||btn.dataset.deleteUser?'delete':btn.dataset.editTicket||btn.dataset.editPromo||btn.dataset.editUser||btn.dataset.toggleTicket||btn.dataset.togglePromo||btn.dataset.payToggle||btn.dataset.orderStatus?'update':'update';if(!requireAccess(targetEdit,act))return;}
if(btn.dataset.editRole){if(!requireAccess('roles','update'))return;state.editingRole=btn.dataset.editRole;render();return}if(btn.dataset.deleteRole){if(!requireAccess('roles','delete'))return;const r=db.roles[btn.dataset.deleteRole];if(!r||r.system)return toast('Role bawaan tidak bisa dihapus.',true);if(db.users.some(u=>u.role===r.id))return toast('Role masih digunakan oleh pengguna.',true);delete db.roles[r.id];save();render();toast('Role dihapus.');return}
if(btn.dataset.chooseTicket){state.selected=btn.dataset.chooseTicket;state.applied=null;state.error='';render();return}if(btn.dataset.method){state.method=btn.dataset.method;render();return}
if(btn.dataset.editTicket){ensureEditing('ticket',btn.dataset.editTicket);return}if(btn.dataset.editPromo){ensureEditing('promo',btn.dataset.editPromo);return}
if(btn.dataset.toggleTicket){let t=db.tickets.find(x=>x.id===btn.dataset.toggleTicket);if(t){t.status=t.status==='ACTIVE'?'INACTIVE':'ACTIVE';save();render();toast('Status tiket diperbarui.')}return}
if(btn.dataset.togglePromo){let p=db.promos.find(x=>x.id===btn.dataset.togglePromo);if(p){p.status=p.status==='ACTIVE'?'INACTIVE':'ACTIVE';save();render();toast('Status promo diperbarui.')}return}
if(btn.dataset.deleteTicket){let t=db.tickets.find(x=>x.id===btn.dataset.deleteTicket);if(t){state.editingType='deleteTicket';state.editing=t.id;render();showDeleteConfirm('ticket',t)}return}
if(btn.dataset.deletePromo){let p=db.promos.find(x=>x.id===btn.dataset.deletePromo);if(p){state.editingType='deletePromo';state.editing=p.id;render();showDeleteConfirm('promo',p)}return}
if(btn.dataset.editUser){state.editing=btn.dataset.editUser;state.editingType='user';render();return}if(btn.dataset.deleteUser){let u=db.users.find(x=>x.id===btn.dataset.deleteUser);if(!u)return;if(u.id===state.currentUser?.id)return toast('Anda tidak dapat menghapus akun sendiri.',true);if(u.role==='superadmin'&&db.users.filter(x=>x.active&&x.role==='superadmin').length<=1)return toast('Super Admin terakhir tidak boleh dihapus.',true);db.users=db.users.filter(x=>x.id!==u.id);save();render();toast('Pengguna dihapus.');return}if(btn.dataset.payToggle){let k=btn.dataset.payToggle;db.payment[k]=!db.payment[k];save();render();toast('Pengaturan pembayaran diperbarui.');return}
if(btn.dataset.downloadTicket){downloadTicketCard(btn.dataset.downloadTicket,Number(btn.dataset.ticketIndex||0));return}
if(btn.dataset.orderStatus){if(btn.dataset.status==='PAID')markOrderPaid(btn.dataset.orderStatus);else if(btn.dataset.status==='CANCELLED')markOrderCancelled(btn.dataset.orderStatus);return}
let action=btn.dataset.action;if(!action)return;const actionTab={addTicket:'tickets',addPromo:'promos',confirmDelete:btn.dataset.kind==='ticket'?'tickets':'promos',export:'settings',addUser:'users',removeHero:'content',openTicketScanner:'scan'}[action];if(actionTab&&!requireAccess(actionTab,action==='addTicket'||action==='addPromo'||action==='addUser'?'create':action==='confirmDelete'?'delete':'update'))return;
switch(action){case 'openAdmin':navigate(state.logged?'admin':'login');break;case 'openTicketScanner':if(!requireAccess('scan','update'))return;stopScanner();state.scanOpen=true;state.scanError='';state.scanResult=null;render();break;case 'stopTicketScanner':stopScanner();state.scanOpen=false;state.scanError='';const se=$('scanStatus');if(se)se.textContent='Kamera dihentikan. Input manual tetap tersedia.';break;case 'closeScanner':state.scanOpen=false;state.scanError='';state.scanResult=null;stopScanner();render();break;case 'closeUserQr':render();break;case 'logout':state.logged=false;state.currentUser=null;state.adminTab='dashboard';navigate('home');break;case 'addTicket':ensureEditing('ticket','');break;case 'addPromo':ensureEditing('promo','');break;case 'addRole':if(!requireAccess('roles','create'))return;state.editingRole='';render();break;case 'cancelRole':state.editingRole=null;render();break;case 'exportReport':exportReport();break;case 'addUser':state.editing=null;state.editingType='user';render();break;case 'removeHero':db.content.heroImage='';save();render();toast('Gambar banner dihapus.');break;case 'closeEditor':state.editing=null;render();break;case 'minusQty':state.qty=Math.max(1,state.qty-1);state.applied=null;render();break;case 'plusQty':state.qty=Math.min(99,state.qty+1);state.applied=null;render();break;case 'removePromo':state.applied=null;state.promo='';state.error='';render();break;case 'placeOrder':placeOrder();break;case 'confirmDigitalPayment':placeOrder('PAID');break;case 'print':window.print();break;case 'export':exportDB();break;case 'confirmDelete':deleteSelected(btn.dataset.kind);break;case 'cancelDelete':state.editing=null;state.editingType=null;render();break;}}
);
function showDeleteConfirm(kind,obj){const name=kind==='ticket'?obj.name:obj.code;let host=document.querySelector('.admin-main');let card=document.createElement('div');card.id='deleteConfirm';card.className='panel editing';card.innerHTML=`<h2>Hapus ${kind==='ticket'?'tiket':'promo'}?</h2><p>Anda akan menghapus <b>${esc(name)}</b>. Tindakan ini tidak dapat dibatalkan. Transaksi lama tetap tersimpan.</p><div class="stack"><button class="btn danger" data-action="confirmDelete" data-kind="${kind}">Ya, Hapus</button><button class="btn ghost" data-action="cancelDelete">Batal</button></div>`;host.insertBefore(card,host.children[1]||null);card.scrollIntoView({behavior:'smooth',block:'start'})}
function deleteSelected(kind){if(kind==='ticket')db.tickets=db.tickets.filter(x=>x.id!==state.editing);else db.promos=db.promos.filter(x=>x.id!==state.editing);state.editing=null;state.editingType=null;save();render();toast('Data berhasil dihapus.')}
function makePaymentRef(method,orderId=''){const clean=String(orderId||'').replace(/[^A-Z0-9]/gi,'').slice(-10);const seed=clean||Date.now().toString(36).toUpperCase();if(method==='wallet')return 'EW-'+seed+'-'+Math.floor(100000+Math.random()*900000);if(method==='cash')return 'KSR-'+seed;return 'QRIS-'+seed+'-'+Math.floor(1000+Math.random()*9000)}
function paymentQrPayload(order){return `MKIOS-PAY|QRIS|${order.id}|${order.total}|${order.paymentRef}`}
function ticketPreviewMarkup(order,{showActions=false}={}){const count=Math.max(0,Math.min(99,Math.floor(Number(order?.qty)||0)));if(!order||!count)return '';const paid=order.status==='PAID';return `<section class="ticket-preview-panel"><div class="panel-head"><div><h2>Preview Tiket</h2><p class="muted">QR dibuat per pack. QR dapat diterbitkan setelah pembayaran berstatus PAID.</p></div><span class="badge ${paid?'green':''}">${paid?'Tiket Aktif':'Preview • Belum Aktif'}</span></div><div class="ticket-preview-grid">${Array.from({length:count},(_,i)=>{const serial=ticketQrSerial(order,i),qr=makeQrDataUrl(ticketQrPayload(order,i),190);return `<article class="ticket-preview-card"><div class="eyebrow">${esc(db.content.brand)} • QR PASS</div><h3>${esc(order.ticketName)}</h3><div class="ticket-pack">Pack ${i+1} / ${count}</div><div class="qr-box large">${makeQrSvg(ticketQrPayload(order,i),230)}</div><div class="barcode-text">${esc(serial)}</div><div class="summary-line"><span>Pesanan</span><b>${esc(order.id)}</b></div><div class="summary-line"><span>Pembayaran</span><b>${esc(order.payment)}</b></div><div class="summary-line"><span>Status</span><b>${esc(order.status)}</b></div>${showActions&&paid?`<button class="btn soft sm wide no-print\" data-download-ticket="${esc(order.id)}\" data-ticket-index="${i}\">↓ Unduh Tiket PNG</button>`:''}${!paid?`<small class="preview-note">QR ini hanya preview. Check-in akan ditolak sampai pembayaran lunas.</small>`:''}</article>`}).join('')}</div></section>`}
function paymentMethodPreview(method,total,ticket,qty){if(method==='qris'){const payload=`MKIOS-PAY|QRIS|SIMULASI|${total}|${ticket?.id||''}|${qty}`;const qr=makeQrSvg(payload,260);const ref=makePaymentRef('qris',ticket?.id||'');return `<div class="payment-demo qris-demo"><div><div class="eyebrow">SIMULASI QRIS</div><h3>Scan QR untuk membayar</h3><p class="muted">QR ini dummy. Tidak terhubung ke bank, QRIS merchant, atau payment gateway.</p><div class="qr-box large">${qr}</div></div><div class="payment-detail"><div class="summary-line"><span>Total</span><b>${rupiah(total)}</b></div><div class="summary-line"><span>Merchant</span><b>${esc(db.content.brand)}</b></div><div class="summary-line"><span>Referensi</span><b>${esc(ref)}</b></div><small>Simulasi hanya menampilkan instruksi. Status transaksi tetap PENDING sampai operator mengonfirmasi pembayaran.</small></div></div>`}if(method==='wallet'){const code=makePaymentRef('wallet',ticket?.id||'');return `<div class="payment-demo"><div class="eyebrow">E-WALLET DEMO</div><h3>Kode pembayaran</h3><div class="wallet-code">${esc(code)}</div><div class="summary-line"><span>Total</span><b>${rupiah(total)}</b></div><div class="summary-line"><span>Merchant</span><b>${esc(db.content.brand)}</b></div><p class="muted">Gunakan kode di atas sebagai referensi pembayaran pada simulasi e-wallet.</p><small>Pesanan tetap PENDING sampai operator mengonfirmasi pembayaran.</small></div>`}return `<div class="payment-demo"><div class="eyebrow">PEMBAYARAN DI KASIR</div><h3>Tunjukkan nomor pesanan ke kasir</h3><div class="cash-order-preview" id="cashOrderPreview">Nomor pesanan dibuat setelah tombol di bawah ditekan.</div><div class="summary-line"><span>Total</span><b>${rupiah(total)}</b></div><p class="muted">Setelah <b>Buat Pesanan Demo</b>, sistem memberikan nomor pesanan. Kasir menerima pembayaran berdasarkan nomor tersebut. Operator kemudian mengubah status menjadi PAID dari dashboard admin.</p></div>`}
function placeOrder(forcedStatus=null){let {t,discount,total,promo}=totals();if(!t||!db.payment[state.method])return toast('Pilih metode pembayaran yang aktif.',true);const id=ident('ORD-MK');const payment=({qris:'QRIS',wallet:'E-Wallet',cash:'Kasir / Tunai'})[state.method];const status=forcedStatus||'PENDING';let order={id,ticketId:t.id,ticketName:t.name,unitPrice:t.price,qty:state.qty,subtotal:t.price*state.qty,discount,total,promoCode:promo?.code||'',payment,status,createdAt:new Date().toISOString(),paymentRef:makePaymentRef(state.method,id),paidAt:status==='PAID'?new Date().toISOString():null,paidBy:status==='PAID'?'SIMULASI CUSTOMER':null};db.transactions.push(order);if(promo)promo.used=(promo.used||0)+1;if(!save())return;state.orderId=order.id;state.printSearch=order.id;state.applied=null;state.promo='';state.selected=null;state.error='';state.method='';navigate('success')}
function exportDB(){let blob=new Blob([JSON.stringify({version:28,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mkios-v28-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup JSON berhasil diekspor.')}
document.addEventListener('submit',async e=>{const form=e.target;if(!['loginForm','ticketForm','promoForm','contentForm','userForm','applyPromo','printForm','manualScanForm','roleForm'].includes(form.id))return;e.preventDefault();const v=Object.fromEntries(new FormData(form).entries());
if(form.id==='manualScanForm'){if(!requireAccess('scan','update'))return;const raw=String(v.qrCode||'').trim();if(!raw)return toast('Masukkan kode QR tiket.',true);stopScanner();state.scanOpen=false;await processTicketQr(raw);return}
if(form.id==='loginForm'){const u=$('loginUser').value.trim(),p=$('loginPass').value;try{if(await signIn(u,p))admin('dashboard');else $('loginError').textContent='Username atau password tidak sesuai atau akun dinonaktifkan.'}catch{$('loginError').textContent='Browser tidak mendukung autentikasi demo ini.'}return}
if(form.id==='roleForm'){const existing=db.roles[state.editingRole];if(!requireAccess('roles',existing?'update':'create'))return;if(existing?.id==='superadmin')return toast('Role Super Admin terkunci.',true);const label=String(v.label||'').trim();if(label.length<3)return toast('Nama role minimal 3 karakter.',true);if(Object.values(db.roles).some(r=>r.id!==existing?.id&&r.label.toLowerCase()===label.toLowerCase()))return toast('Nama role sudah digunakan.',true);const id=existing?.id||ident('ROLE');const permissions={};for(const menu of MENU_IDS){permissions[menu]={};for(const op of CRUD)permissions[menu][op]=Boolean(v['perm_'+menu+'_'+op]);if(CRUD.some(op=>op!=='read'&&permissions[menu][op]))permissions[menu].read=true}db.roles[id]={id,label,permissions,system:existing?.system||false};state.editingRole=null;save();render();toast('Role dan hak akses disimpan.');return}
if(form.id==='userForm'){if(!requireAccess('users',state.editing?'update':'create'))return;const existing=db.users.find(x=>x.id===state.editing),username=String(v.username||'').trim(),name=String(v.name||'').trim(),password=String(v.password||''),newRole=db.roles[v.role]?v.role:'viewer',active=v.active==='true';if(!/^[a-zA-Z0-9._-]{3,30}$/.test(username)||!name)return toast('Nama atau username tidak valid.',true);if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase()&&x.id!==state.editing))return toast('Username sudah dipakai.',true);if((!existing||password)&&password.length<8)return toast('Password minimal 8 karakter.',true);if(existing?.id===state.currentUser?.id&&(!active||newRole!==existing.role))return toast('Tidak dapat menonaktifkan atau menurunkan role akun sendiri.',true);if(existing?.role==='superadmin'&&existing.active&&(!active||newRole!=='superadmin')&&db.users.filter(x=>x.active&&x.role==='superadmin').length<=1)return toast('Harus ada minimal satu Super Admin aktif.',true);let u=existing||{id:ident('USR')};u.name=name;u.username=username;u.role=newRole;u.active=active;if(password){u.salt=newSalt();u.hash=await digest(password,u.salt)}if(!u.loginSecret)u.loginSecret=randomSecret();if(!existing)db.users.push(u);if(u.id===state.currentUser?.id)state.currentUser={id:u.id,name:u.name,role:u.role};save();state.editing=null;state.editingType=null;render();toast('Pengguna berhasil disimpan.');return}
if(form.id==='ticketForm'){if(!requireAccess('tickets',state.editing?'update':'create'))return;let name=v.name.trim(),price=Number(v.price);if(!name||!Number.isFinite(price)||price<0)return toast('Nama dan harga tiket tidak valid.',true);let item={id:state.editing||ident('TKT'),name,price,icon:v.icon.trim()||'🎟',description:v.description.trim(),status:v.status==='INACTIVE'?'INACTIVE':'ACTIVE'};if(state.editing){let i=db.tickets.findIndex(x=>x.id===state.editing);if(i>=0)db.tickets[i]=item}else db.tickets.push(item);save();state.editing=null;render();toast('Tiket berhasil disimpan.');return}
if(form.id==='promoForm'){if(!requireAccess('promos',state.editing?'update':'create'))return;let code=v.code.trim().toUpperCase(),discount=Number(v.discount),minSpend=Number(v.minSpend),quota=Number(v.quota);if(!code||discount<=0||minSpend<0||!Number.isInteger(quota)||quota<1)return toast('Data promo tidak valid.',true);if(db.promos.some(x=>x.code===code&&x.id!==state.editing))return toast('Kode promo sudah digunakan.',true);let old=db.promos.find(x=>x.id===state.editing);if(old&&quota<(old.used||0))return toast('Kuota tidak boleh kurang dari jumlah penggunaan.',true);let item={id:state.editing||ident('PRM'),code,discount,minSpend,quota,used:old?.used||0,status:v.status==='INACTIVE'?'INACTIVE':'ACTIVE'};if(old)Object.assign(old,item);else db.promos.push(item);save();state.editing=null;render();toast('Promo berhasil disimpan.');return}
if(form.id==='contentForm'){if(!requireAccess('content','update'))return;for(let k of ['brand','headline','subheadline','cta','announcement','heroPosition'])db.content[k]=String(v[k]||'').trim();save();render();toast('Konten halaman customer berhasil disimpan.');return}
if(form.id==='applyPromo'){state.promo=v.promo.trim().toUpperCase();const t=currentTicket();let p=db.promos.find(x=>x.code===state.promo&&x.status==='ACTIVE'&&(x.used||0)<x.quota&&t&&t.price*state.qty>=x.minSpend);state.applied=p?p.code:null;state.error=p?'':'Kode tidak valid, kuota habis, atau minimum belanja belum terpenuhi.';render();return}
if(form.id==='printForm'){state.printSearch=v.code.trim();state.error='';render();return}});
document.addEventListener('input',e=>{if(e.target.id==='tableSearch'){state.search=e.target.value;refreshTable()}});document.addEventListener('change',async e=>{if(e.target.id==='scanImageUpload'){const file=e.target.files?.[0];if(file)await scanImageFile(file);return}if(['reportFrom','reportTo','reportStatus','reportMethod'].includes(e.target.id)){state[e.target.id]=e.target.value;render();return} if(e.target.id==='filterStatus'){state.statusFilter=e.target.value;render()}if(e.target.id==='heroUpload'){if(!requireAccess('content','update'))return;const file=e.target.files?.[0];if(!file)return;try{if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Gunakan gambar JPG, PNG, atau WebP.');if(file.size>8_000_000)throw Error('Ukuran gambar maksimal 8 MB.');const image=await createImageBitmap(file);const scale=Math.min(1,1400/image.width,900/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);image.close();const data=canvas.toDataURL('image/jpeg',.78);if(data.length>2_300_000)throw Error('Gambar hasil kompresi terlalu besar.');const previous=db.content.heroImage;db.content.heroImage=data;if(!save()){db.content.heroImage=previous;return}render();toast('Banner berhasil diunggah dan ditampilkan pada beranda.')}catch(err){toast(err.message||'Gagal memproses gambar.',true)}return}if(e.target.id==='importFile'){if(!requireAccess('settings','update'))return;const f=e.target.files?.[0];if(!f)return;try{if(f.size>3_000_000)throw Error('File terlalu besar.');let d=JSON.parse(await f.text());if(!Array.isArray(d.tickets)||!Array.isArray(d.promos)||!Array.isArray(d.transactions)||!d.content||!d.payment)throw Error('Struktur backup tidak valid.');if(d.tickets.some(x=>typeof x.name!=='string'||!Number.isFinite(x.price))||d.transactions.some(x=>!x.id||!Number.isFinite(x.total)))throw Error('Isi data tidak valid.');db={...clone(defaults),...d,payment:{...defaults.payment,...d.payment},content:{...defaults.content,...d.content},settings:{...defaults.settings,...(d.settings||{})}};if(!Array.isArray(db.users))db.users=[];initRoles();ensureUserQrSecrets();save();render();toast('Backup berhasil diimpor.')}catch(err){toast(err.message||'Gagal membaca file.',true)}}});
ensureUserQrSecrets();
initRoles();
render();
